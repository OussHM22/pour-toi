<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour toi 🌷</title>
<meta property="og:title" content="Pour toi, Pauline 🌷">
<meta property="og:description" content="Ouvre-moi…">
<meta name="theme-color" content="#070d1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg1:#070d1f; --bg2:#10264a; --ground:#1d4f5c; --text:#fff8e6; --glow:255,214,110; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:var(--bg1); }
  body {
    background: radial-gradient(ellipse at 50% 115%, var(--ground) 0%, var(--bg2) 40%, var(--bg1) 85%);
    font-family:'Dancing Script', cursive; color:var(--text);
    -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  }
  #garden { position:fixed; inset:0; width:100%; height:100%; z-index:2; }

  /* ---------- Intro ---------- */
  #intro {
    position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:30px; padding:0 16px; text-align:center;
    transition:opacity 1.2s ease;
  }
  #intro.hide { opacity:0; pointer-events:none; }
  .intro-text { font-size:clamp(2.1rem, 9vw, 3.6rem); text-shadow:0 0 16px rgba(var(--glow),.55); animation:fadeUp 1.6s both; }
  #open {
    font-family:inherit; font-size:1.7rem; padding:14px 40px; border-radius:999px; cursor:pointer;
    color:var(--text); background:rgba(var(--glow),.12); border:1px solid rgba(255,230,150,.6);
    animation:fadeUp 1.6s .7s both, pulse 2.6s 2.3s infinite;
  }

  /* ---------- Messaggio ---------- */
  #message {
    position:fixed; left:0; right:0; top:max(9vh, env(safe-area-inset-top)); z-index:5;
    text-align:center; padding:0 16px; pointer-events:none;
  }
  #message h1 { font-size:clamp(2.6rem, 11vw, 5rem); font-weight:700; opacity:0; text-shadow:0 0 20px rgba(var(--glow),.7), 0 0 40px rgba(110,170,255,.35); }
  #message.show h1 { animation:fadeUp 2.2s both; }
  #lines { position:relative; margin:10px auto 0; max-width:640px; min-height:7.5em; }
  #lines p {
    position:absolute; left:0; right:0; top:0;
    font-size:clamp(1.35rem, 5.8vw, 2.2rem); font-weight:500; line-height:1.3;
    text-shadow:0 0 12px rgba(var(--glow),.5);
    opacity:0; transform:translateY(14px); transition:opacity 1.4s ease, transform 1.4s ease;
  }
  #lines p.on { opacity:1; transform:none; }

  /* ---------- Musica ---------- */
  #music {
    position:fixed; right:12px; bottom:max(12px, env(safe-area-inset-bottom)); z-index:8;
    width:200px; height:113px; border-radius:12px; overflow:hidden;
    opacity:0; pointer-events:none; transition:opacity 1s;
  }
  #music.visible { opacity:.92; pointer-events:auto; box-shadow:0 0 18px rgba(var(--glow),.45); }
  #music-hint {
    position:fixed; right:12px; bottom:calc(max(12px, env(safe-area-inset-bottom)) + 120px); z-index:8;
    width:200px; text-align:center; font-size:1.2rem; opacity:0; transition:opacity 1s; pointer-events:none;
  }
  #music-hint.visible { opacity:.9; }

  /* ---------- Fiori (SVG) ---------- */
  .flower, .leaf, .bloom, .pl, .pr, .daisy, .dstem, .grass { transform-box:fill-box; }
  .back-row { opacity:.78; }
  .far-row { opacity:.7; }
  .sunhead { transform-box:fill-box; transform-origin:50% 50%; animation:spinPop 1.4s cubic-bezier(.3,1.4,.5,1) calc(var(--d) + 1.3s) both; }
  .stem { fill:none; stroke:#4f9460; stroke-linecap:round; animation:grow 1.6s cubic-bezier(.4,0,.2,1) var(--d) both; }
  .leaf { transform-origin:50% 100%; animation:pop 1s cubic-bezier(.3,1.4,.5,1) calc(var(--d) + .7s) both; }
  .bloom { transform-origin:50% 100%; animation:pop 1.1s cubic-bezier(.3,1.5,.5,1) calc(var(--d) + 1.3s) both; }
  .pl { transform-origin:50% 100%; animation:openL 1.5s ease-out calc(var(--d) + 1.8s) both; }
  .pr { transform-origin:50% 100%; animation:openR 1.5s ease-out calc(var(--d) + 1.8s) both; }
  .flower { transform-origin:50% 100%; animation:sway var(--sw) ease-in-out calc(var(--d) + 2.8s) infinite; }
  .grass { transform-origin:50% 100%; animation:pop 1.6s cubic-bezier(.3,1.2,.5,1) .1s both; }
  .daisy { transform-origin:50% 50%; animation:spinPop 1s cubic-bezier(.3,1.5,.5,1) var(--d) both; }
  .dstem { transform-origin:50% 100%; animation:pop .6s ease-out calc(var(--d) - .3s) both; }

  @keyframes grow   { to { stroke-dashoffset:0; } }
  @keyframes pop    { from { transform:scale(0); } to { transform:scale(1); } }
  @keyframes spinPop{ from { transform:scale(0) rotate(-120deg); } to { transform:scale(1) rotate(0); } }
  @keyframes openL  { from { transform:rotate(-3deg); } to { transform:rotate(-20deg); } }
  @keyframes openR  { from { transform:rotate(3deg); }  to { transform:rotate(20deg); } }
  @keyframes sway   { 0%,100% { transform:rotate(0); } 25% { transform:rotate(var(--sa)); } 75% { transform:rotate(calc(var(--sa) * -1)); } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  @keyframes pulse  { 0%,100% { box-shadow:0 0 0 0 rgba(var(--glow),.45); } 50% { box-shadow:0 0 0 14px rgba(var(--glow),0); } }

  /* ---------- Asinello ---------- */
  #donkey {
    position:fixed; left:0; bottom:1vh; z-index:3; width:clamp(110px, 17vw, 170px);
    transform:translateX(-120%); pointer-events:none;
  }
  #donkey.walk { animation:walk 34s linear 4s infinite; }
  #donkey svg { display:block; width:100%; height:auto; overflow:visible; }
  @keyframes walk { 0% { transform:translateX(-120%); } 85%, 100% { transform:translateX(calc(100vw + 20%)); } }
  .leg, .dk-tail, .dk-head, .dk-ear, .dk-bob { transform-box:fill-box; }
  .leg { transform-origin:50% 6%; animation:step .7s ease-in-out infinite alternate; }
  .l1, .l4 { animation-delay:-.7s; }
  @keyframes step { from { transform:rotate(16deg); } to { transform:rotate(-16deg); } }
  .dk-bob { animation:bob .35s ease-in-out infinite alternate; }
  @keyframes bob { to { transform:translateY(-2px); } }
  .dk-tail { transform-origin:100% 0; animation:tail 1.6s ease-in-out infinite alternate; }
  @keyframes tail { from { transform:rotate(-10deg); } to { transform:rotate(12deg); } }
  .dk-head { transform-origin:0% 100%; animation:nod 1.4s ease-in-out infinite alternate; }
  @keyframes nod { from { transform:rotate(-2deg); } to { transform:rotate(3deg); } }
  .dk-ear { transform-origin:50% 100%; animation:ear 3.2s ease-in-out infinite; }
  .e2 { animation-delay:-1.1s; }
  @keyframes ear { 0%,80%,100% { transform:rotate(0); } 88% { transform:rotate(-14deg); } 94% { transform:rotate(6deg); } }

  /* ---------- Gatto nero ---------- */
  #cat {
    position:fixed; left:3vw; bottom:0; z-index:4; width:clamp(72px, 11vw, 120px);
    opacity:0; pointer-events:none;
  }
  #cat.show { animation:fadeUp 1.6s 2.8s both; }
  #cat svg { display:block; width:100%; height:auto; overflow:visible; }
  .fur { stroke:rgba(150,180,235,.38); stroke-width:1.2; }
  .cat-tail, .cat-head, .cat-eyes { transform-box:fill-box; }
  .cat-tail { transform-origin:0% 95%; animation:catTail 3.2s ease-in-out infinite alternate; }
  @keyframes catTail { from { transform:rotate(4deg); } to { transform:rotate(-10deg); } }
  .cat-head { transform-origin:50% 90%; animation:catHead 8s ease-in-out infinite; }
  @keyframes catHead { 0%,55%,100% { transform:rotate(0); } 65%,82% { transform:rotate(-7deg); } }
  .cat-eyes { transform-origin:50% 50%; animation:catBlink 4.6s infinite; }
  @keyframes catBlink { 0%,90%,100% { transform:scaleY(1); } 93% { transform:scaleY(.08); } }

  /* ---------- Atmosfera ---------- */
  .star { position:fixed; width:2px; height:2px; border-radius:50%; background:#fff; z-index:1; animation:twinkle var(--t) ease-in-out var(--dl) infinite; }
  @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.9; } }
  .ff {
    position:fixed; width:5px; height:5px; border-radius:50%; z-index:3; pointer-events:none; opacity:0;
    background:#fff6b0; box-shadow:0 0 10px 3px rgba(255,240,150,.7);
    animation:blink var(--b) ease-in-out var(--bd) infinite, drift var(--t) ease-in-out infinite alternate;
  }
  @keyframes blink { 0%,100% { opacity:0; } 50% { opacity:.95; } }
  @keyframes drift { to { transform:translate(var(--dx), var(--dy)); } }

  .petal {
    position:fixed; top:-30px; z-index:4; pointer-events:none; opacity:.85;
    width:var(--s); height:calc(var(--s) * 1.4); background:var(--c); border-radius:80% 0 80% 0;
    animation:fall var(--t) linear forwards;
  }
  @keyframes fall { to { transform:translate(var(--dx), 110vh) rotate(var(--r)); } }

  .heart { position:fixed; z-index:6; pointer-events:none; font-size:var(--s); color:var(--c); animation:burst 1.1s ease-out forwards; }
  @keyframes burst { from { transform:translate(-50%,-50%) scale(.4); opacity:1; } to { transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity:0; } }
</style>
</head>
<body>

<div id="intro">
  <p class="intro-text">J'ai quelque chose pour toi…</p>
  <button id="open">Ouvrir 🌷</button>
</div>

<svg id="garden" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>

<div id="message">
  <h1></h1>
  <div id="lines"></div>
</div>

    </linearGradient>

  <g class="dk-bob">

    <g class="leg l2"><rect x="44" y="76" width="9" height="34" rx="4" fill="#6c6780"/><rect x="43" y="106" width="11" height="7" rx="2" fill="#3a3445"/></g>
    <g class="leg l4"><rect x="96" y="76" width="9" height="34" rx="4" fill="#6c6780"/><rect x="95" y="106" width="11" height="7" rx="2" fill="#3a3445"/></g>
    <!-- coda -->
    <g class="dk-tail">
      <path d="M31,60 C19,66 17,80 20,90" stroke="#7f7a93" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- zampe lato vicino -->

    <g class="leg l3"><rect x="104" y="78" width="10" height="34" rx="4.5" fill="#928da6"/><rect x="103" y="108" width="12" height="7" rx="2" fill="#3a3445"/></g>

      </g>

        <ellipse cx="133" cy="12" rx="5" ry="14" fill="#b0acbd" transform="rotate(12 133 12)"/>

      </g>
      <ellipse cx="130" cy="36" rx="17" ry="14" fill="#b0acbd"/>
      <ellipse cx="143" cy="45" rx="12" ry="10" fill="#ebe6ef"/>
      <ellipse cx="148.5" cy="43.5" rx="1.8" ry="1.3" fill="#4a4458"/>
      <path d="M140,51 q4,3 8,0" stroke="#4a4458" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <circle cx="131" cy="31" r="3.7" fill="#1d1a24"/>
      <circle cx="132.4" cy="29.7" r="1.3" fill="#fff"/>
      <ellipse cx="136" cy="40" rx="3.6" ry="2.3" fill="#ff9fbf" opacity=".55"/>
      <path d="M121,23 c3,-5 9,-5 11,0 c-3,0 -7,2 -11,0z" fill="#4a4458"/>
      <!-- fiorellino giallo sull'orecchio -->
      <g transform="translate(127,21)">
        <circle cx="0" cy="-3" r="2.4" fill="#ffd84a"/><circle cx="2.9" cy="-.9" r="2.4" fill="#ffd84a"/>
        <circle cx="1.8" cy="2.4" r="2.4" fill="#ffd84a"/><circle cx="-1.8" cy="2.4" r="2.4" fill="#ffd84a"/>
        <circle cx="-2.9" cy="-.9" r="2.4" fill="#ffd84a"/><circle r="1.6" fill="#ff9f1c"/>
      </g>
    </g>
  </g>
</svg>
</div>

<!-- Gatto nero con occhi verdi -->
<div id="cat" aria-hidden="true">
<svg viewBox="0 0 122 152">
  <defs>
    <radialGradient id="catEye" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#e2ffa8"/><stop offset=".5" stop-color="#62e66c"/><stop offset="1" stop-color="#1c8a38"/>

    <path class="fur" d="M33,48 L36,14 L57,33 Z" fill="#0d0d12"/>

      <ellipse cx="49" cy="55" rx="7" ry="8" fill="url(#catEye)"/>

      <ellipse cx="49" cy="55" rx="1.9" ry="6.2" fill="#050505"/>

    <path d="M61,68.5 q-3,4 -6,2 M61,68.5 q3,4 6,2" stroke="#6b6b7a" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <g stroke="#cfd6e6" stroke-width=".8" opacity=".55" stroke-linecap="round">
      <line x1="51" y1="66" x2="25" y2="61"/><line x1="51" y1="68" x2="24" y2="69"/>
      <line x1="71" y1="66" x2="97" y2="61"/><line x1="71" y1="68" x2="98" y2="69"/>
    </g>
  </g>
</svg>
</div>

<div id="music"><div id="yt"></div></div>
<div id="music-hint">♫ touche pour la musique</div>

<script>
  /* ====== PERSONALIZZA QUI ====== */
  const TITOLO = "Pour toi, Pauline";
  const FRASI = [
    "Pardon de n'avoir jamais pu t'offrir de vraies tulipes…",
    "alors j'ai fait pousser ce petit jardin, rien que pour toi.",
    "Certaines personnes laissent des fleurs partout où elles passent. Toi, tu en as laissé dans mon cœur.",
    "Je ne t'écris pas pour te faire de la peine, ni pour te forcer à quoi que ce soit.",
    "Je t'écris parce que c'est la vérité : malgré tout ce qui s'est passé, je t'aime.",
    "Ti amo.",
    "Notre compatibilité, je crois qu'on peut toujours l'arranger… et je n'ai jamais cessé de vouloir l'arranger.",
    "Je voulais devenir une meilleure personne, et je voulais que tu sois à mes côtés.",
    "Aujourd'hui j'essaie de le devenir, pour moi, mais aussi pour ce qu'on a été, et pour notre amour.",
    "Je préférerais tout recommencer avec toi, sérieusement, plutôt que de perdre ce qu'on a vécu.",
    "Parce que tu comptes énormément pour moi. Mon cœur et mon âme crient ton nom.",
    "Où que tu sois, j'espère que tu vas bien… et par-dessus tout, je veux que tu sois heureuse.",
    "Même si, au fond de moi, j'espère que ce sera avec moi.",
    "Prends soin de toi, Pauline. 🌷",
  ];
  // tempo di lettura: le frasi lunghe restano più a lungo
  const durata = t => Math.max(4, 2.5 + t.length * .045);
  const YOUTUBE_ID = "266ldDxE3aA"; // Rihanna – Close To You (Rihanna - Topic)
  /* ============================== */

  document.querySelector('#message h1').textContent = TITOLO;
  const linesBox = document.getElementById('lines');
  const lineEls = FRASI.map(t => {
    const p = document.createElement('p');
    p.textContent = t;
    linesBox.appendChild(p);
    return p;
  });

  function playLines() {
    let t = 1.8;
    lineEls.forEach((p, i) => {
      setTimeout(() => {
        if (i > 0) lineEls[i - 1].classList.remove('on');
        p.classList.add('on');
      }, t * 1000);
      t += durata(FRASI[i]);
    });
  }

  /* ---------- Musica (YouTube) ---------- */
  let player, playerReady = false, wantPlay = false;
  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('yt', {
      width: 200, height: 113, videoId: YOUTUBE_ID,
      playerVars: { playsinline: 1, controls: 1, rel: 0, modestbranding: 1 },
      events: {
        onReady: () => { playerReady = true; if (wantPlay) startMusic(); },
        onStateChange: e => { if (e.data === YT.PlayerState.PLAYING) hideMusicCard(); }
      }
    });
  };
  (function loadYT() {
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  })();

  function startMusic() {
    wantPlay = true;
    if (!playerReady) return;
    try { player.setVolume(70); player.playVideo(); } catch (e) {}
    // Su iPhone l'audio parte solo toccando il player: se non è partito, lo mostriamo
    setTimeout(() => {
      if (player.getPlayerState && player.getPlayerState() !== YT.PlayerState.PLAYING) {
        document.getElementById('music').classList.add('visible');
        document.getElementById('music-hint').classList.add('visible');
      }
    }, 2500);
  }
  function hideMusicCard() {
    document.getElementById('music').classList.remove('visible');
    document.getElementById('music-hint').classList.remove('visible');
  }

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById('garden');
  // [punta chiara, medio, base scura]
  const PALETTE = [
    ['#fff6c2', '#ffd84a', '#d98e00'],  // giallo
    ['#dcebff', '#6fa8ff', '#1f4fb8'],  // blu
    ['#f6fadf', '#cfe6a0', '#4f8f3e'],  // verde (tulipano viridiflora)
    ['#ffb3a8', '#ff3b3b', '#9c0c1c'],  // rosso
    ['#ffd2b0', '#ff8a4c', '#bf3d0a'],  // arancio
    ['#ffd6e0', '#ff86a6', '#c2185b'],  // rosa
    ['#ffc2e8', '#ff3fae', '#a3006b'],  // fucsia
    ['#ead4ff', '#b77cff', '#5f22a8'],  // viola
    ['#f3e8ff', '#d4b8ff', '#8a5fd1'],  // lilla
    ['#ffe0d6', '#ff9e85', '#d4523a'],  // corallo
    ['#fff0e0', '#ffd0a8', '#e0915a'],  // pesca
    ['#c9a3d9', '#6a2c7a', '#2e0a3a'],  // viola scuro (Queen of Night)
    ['#e2f1ff', '#9cc9ff', '#3d6fd1'],  // azzurro
    ['#ffffff', '#f1f4ff', '#a9b6d3'],  // bianco
  ];
  const WEIGHTS = PALETTE.map(() => 1);  // tutti i colori con la stessa probabilità
  const WEIGHT_SUM = WEIGHTS.reduce((a, b) => a + b, 0);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  function pickColor() {
    let t = Math.random() * WEIGHT_SUM;
    for (let i = 0; i < WEIGHTS.length; i++) if ((t -= WEIGHTS[i]) < 0) return i;
    return 0;
  }

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  const petalPath = (w, h) =>
    `M0,0 C${-w*1.3},${-h*.15} ${-w},${-h*.85} 0,${-h} C${w},${-h*.85} ${w*1.3},${-h*.15} 0,0Z`;
  const leafPath = (w, l) =>
    `M0,0 C${-w*1.2},${-l*.2} ${-w*.9},${-l*.75} ${-w*.25},${-l} C${-w*.1},${-l*.65} ${w*.35},${-l*.3} 0,0Z`;

  // un petalo con sfumatura, ombra laterale e venatura centrale
  function petal(parent, cls, w, h, ci, front) {
    const g = el('g', cls ? { class: cls } : {}, parent);
    const d = petalPath(w, h);
    el('path', { d, fill: `url(#${front ? 'q' : 'p'}${ci})`, stroke: PALETTE[ci][2], 'stroke-opacity': .45, 'stroke-width': .7 }, g);
    el('path', { d, fill: 'url(#shade)' }, g);
    el('path', { d: `M0,${-h * .06} Q${w * .14},${-h * .5} 0,${-h * .9}`, stroke: PALETTE[ci][2], 'stroke-opacity': .3, 'stroke-width': .8, fill: 'none' }, g);
  }

  function tulip(layer, x, h, s, d, H) {
    const r = rand(18, 25) * s;
    const bend = rand(-1, 1) * h * .12;
    const tx = x + bend * .7, ty = H - h;
    const ci = pickColor();
    const g = el('g', { class: 'flower', style: `--d:${d.toFixed(2)}s;--sw:${rand(4, 6.5).toFixed(2)}s;--sa:${rand(1, 2.2).toFixed(2)}deg` }, layer);

    const stem = el('path', { class: 'stem', d: `M${x},${H + 4} Q${x + bend},${H - h * .5} ${tx},${ty}`, 'stroke-width': (2.8 * s).toFixed(1) }, g);
    const len = stem.getTotalLength();
    stem.style.strokeDasharray = len;
    stem.style.strokeDashoffset = len;

    const lh = h * rand(.32, .48), lw = r * rand(.9, 1.2);
    [[-1, rand(-26, -10)], [1, rand(10, 26)]].forEach(([side, rot], i) => {
      if (i === 1 && Math.random() < .35) return;
      const lg = el('g', { transform: `translate(${x + bend * .08},${H - h * rand(.04, .14)}) rotate(${rot}) scale(${side},1)` }, g);
      const leaf = el('g', { class: 'leaf' }, lg);
      el('path', { d: leafPath(lw, lh), fill: 'url(#leaf)' }, leaf);
      el('path', { d: `M0,0 Q${-lw * .45},${-lh * .5} ${-lw * .25},${-lh}`, stroke: 'rgba(225,255,230,.28)', 'stroke-width': 1, fill: 'none' }, leaf);
    });

    const tilt = Math.atan2(tx - (x + bend), h * .5) * 180 / Math.PI;
    const head = el('g', { transform: `translate(${tx},${ty + 2}) rotate(${tilt})` }, g);
    const bloom = el('g', { class: 'bloom' }, head);
    el('ellipse', { cx: 0, cy: -r * .05, rx: r * .28, ry: r * .2, fill: '#4f9460' }, bloom);
    petal(bloom, '', r * .78, r * 2.1, ci, false);
    petal(bloom, 'pl', r * .74, r * 1.9, ci, false);
    petal(bloom, 'pr', r * .74, r * 1.9, ci, false);
    petal(bloom, '', r * .6, r * 1.85, ci, true);
  }

  // stelo che cresce + foglie, usato da girasoli e rose
  function stemWithLeaves(g, x, h, s, H, bend, leafW, leafL, leafAt, angle) {
    const tx = x + bend * .7, ty = H - h;
    const stem = el('path', { class: 'stem', d: `M${x},${H + 4} Q${x + bend},${H - h * .5} ${tx},${ty}`, 'stroke-width': (3 * s).toFixed(1) }, g);
    const len = stem.getTotalLength();
    stem.style.strokeDasharray = len;
    stem.style.strokeDashoffset = len;
    leafAt.forEach((t, i) => {
      const p = stem.getPointAtLength(len * t);
      const side = i % 2 ? 1 : -1;
      const lg = el('g', { transform: `translate(${p.x},${p.y}) rotate(${side * angle * rand(.8, 1.2)}) scale(${side},1)` }, g);
      const leaf = el('g', { class: 'leaf' }, lg);
      el('path', { d: leafPath(leafW, leafL), fill: 'url(#leaf)' }, leaf);
      el('path', { d: `M0,0 Q${-leafW * .45},${-leafL * .5} ${-leafW * .25},${-leafL}`, stroke: 'rgba(225,255,230,.28)', 'stroke-width': 1, fill: 'none' }, leaf);
    });
    return { tx, ty };
  }

  function sunflower(layer, x, h, s, d, H) {
    const r = rand(17, 23) * s;
    const g = el('g', { class: 'flower', style: `--d:${d.toFixed(2)}s;--sw:${rand(5, 7.5).toFixed(2)}s;--sa:${rand(.8, 1.6).toFixed(2)}deg` }, layer);
    const { tx, ty } = stemWithLeaves(g, x, h, s, H, rand(-1, 1) * h * .07, r * rand(1.2, 1.5), r * rand(2, 2.6), [.35, .55, .75], 55);
    const head = el('g', { transform: `translate(${tx},${ty})` }, g);
    const sun = el('g', { class: 'sunhead' }, head);
    const disc = r * .48, pl = r * .62;
    for (let i = 0; i < 16; i++)  // petali dietro, più scuri
      el('ellipse', { cx: 0, cy: -(disc + pl * .75), rx: r * .2, ry: pl, fill: '#e09a00', transform: `rotate(${i * 22.5 + 11.25})` }, sun);
    for (let i = 0; i < 16; i++)
      el('ellipse', { cx: 0, cy: -(disc + pl * .7), rx: r * .19, ry: pl * .95, fill: 'url(#sunPetal)', transform: `rotate(${i * 22.5})` }, sun);
    el('circle', { r: disc, fill: 'url(#sunDisc)' }, sun);
    for (let i = 1; i < 34; i++) {  // semi disposti a spirale
      const a = i * 2.39996, rr = disc * .9 * Math.sqrt(i / 34);
      el('circle', { cx: Math.cos(a) * rr, cy: Math.sin(a) * rr, r: .9 * s, fill: '#2a1604', opacity: .6 }, sun);
    }
  }

  // [chiaro, medio, scuro]
  const ROSE_PALETTE = [
    ['#fff3b0', '#ffd23f', '#c78a00'],  // gialla
    ['#ff9a9a', '#d7263d', '#7a0f1f'],  // rossa
    ['#ffd6e2', '#f48fb1', '#ad1457'],  // rosa
    ['#fffaf0', '#ffe4c4', '#c9a27e'],  // crema
  ];
  function rose(layer, x, h, s, d, H) {
    const r = rand(14, 19) * s;
    const ci = pick([0, 0, 1, 1, 2, 3]);
    const c = ROSE_PALETTE[ci];
    const g = el('g', { class: 'flower', style: `--d:${d.toFixed(2)}s;--sw:${rand(4, 6).toFixed(2)}s;--sa:${rand(1, 2).toFixed(2)}deg` }, layer);
    const { tx, ty } = stemWithLeaves(g, x, h, s * .8, H, rand(-1, 1) * h * .1, r * .6, r * 1.4, [.3, .5, .7], 50);
    const head = el('g', { transform: `translate(${tx},${ty}) rotate(${rand(0, 72)})` }, g);
    const b = el('g', { class: 'sunhead' }, head);
    // anelli di petali, dal più esterno al più interno, con il bordo chiaro
    [[5, 1, 0], [5, .72, 36], [4, .48, 10]].forEach(([cnt, sc, off], ring) => {
      for (let i = 0; i < cnt; i++)
        el('ellipse', {
          cx: 0, cy: -r * .5 * sc, rx: r * .56 * sc, ry: r * .6 * sc,
          fill: `url(#rs${ci})`, stroke: c[0], 'stroke-width': .9, 'stroke-opacity': ring ? .8 : .5,
          transform: `rotate(${i * 360 / cnt + off})`
        }, b);
    });
    el('circle', { r: r * 1.15, fill: 'url(#roseDepth)' }, b);
    el('path', { d: `M0,0 c${r * .12},${-r * .12} ${r * .26},0 ${r * .18},${r * .14} c${-r * .1},${r * .18} ${-r * .36},${r * .1} ${-r * .34},${-r * .12} c${r * .02},${-r * .28} ${r * .4},${-r * .32} ${r * .5},${-r * .04}`, stroke: c[2], 'stroke-width': 1.2 * s, 'stroke-opacity': .75, fill: 'none', 'stroke-linecap': 'round' }, b);
  }

  function smallStem(layer, x, y, s, d, H) {
    const g = el('g', { transform: `translate(${x},${y})`, style: `--d:${d.toFixed(2)}s` }, layer);
    el('path', { class: 'dstem', d: `M0,0 L0,${H - y + 4}`, stroke: '#3a9a50', 'stroke-width': 1.6 * s }, g);
    return el('g', { class: 'daisy' }, g);
  }

  function daisy(layer, x, y, s, d, H) {
    const inner = smallStem(layer, x, y, s, d, H);
    const col = pick(['#ffffff', '#fff3b0', '#fffbe8']);
    const pr = 5 * s;
    for (let i = 0; i < 8; i++)
      el('ellipse', { cx: 0, cy: -pr * 1.1, rx: pr * .5, ry: pr * 1.1, fill: col, transform: `rotate(${i * 45})` }, inner);
    el('circle', { r: pr * .7, fill: '#ffc93c' }, inner);
  }

  // non-ti-scordar-di-me azzurri
  function forgetMeNot(layer, x, y, s, d, H) {
    const inner = smallStem(layer, x, y, s, d, H);
    const pr = 4.4 * s;
    for (let i = 0; i < 5; i++)
      el('circle', { cx: 0, cy: -pr * .62, r: pr * .6, fill: 'url(#fmn)', transform: `rotate(${i * 72})` }, inner);
    el('circle', { r: pr * .36, fill: '#fff6c8' }, inner);
    el('circle', { r: pr * .18, fill: '#ffc93c' }, inner);
  }

  function grass(layer, W, H) {
    const g = el('g', { class: 'grass' }, layer);
    const n = Math.round(W / 5);
    for (let i = 0; i < n; i++) {
      const x = rand(-5, W + 5), hh = rand(18, Math.min(70, H * .09));
      el('path', {
        d: `M${x},${H + 2} Q${x + rand(-6, 6)},${H - hh * .6} ${x + rand(-14, 14)},${H - hh}`,
        stroke: pick(['#2d7f3e', '#3a9a50', '#24683a', '#4caf5f', '#3f8f6a', '#5cbf72']),
        'stroke-width': rand(1.5, 3).toFixed(1), fill: 'none', 'stroke-linecap': 'round'
      }, g);
    }
  }

  function build() {
    svg.innerHTML = '';
    const W = innerWidth, H = innerHeight;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

    const defs = el('defs', {}, svg);
    PALETTE.forEach((c, i) => {
      const p = el('linearGradient', { id: 'p' + i, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
      el('stop', { offset: '0%', 'stop-color': c[0] }, p);
      el('stop', { offset: '45%', 'stop-color': c[1] }, p);
      el('stop', { offset: '100%', 'stop-color': c[2] }, p);
      const q = el('linearGradient', { id: 'q' + i, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
      el('stop', { offset: '0%', 'stop-color': c[0] }, q);
      el('stop', { offset: '65%', 'stop-color': c[1] }, q);
      el('stop', { offset: '100%', 'stop-color': c[2] }, q);
    });
    // ombreggiatura laterale che dà volume ai petali
    const sh = el('linearGradient', { id: 'shade', x1: 0, y1: 0, x2: 1, y2: 0 }, defs);
    [['0%', '#000', .28], ['42%', '#fff', .16], ['60%', '#fff', .05], ['100%', '#000', .32]]
      .forEach(([o, c, a]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, sh));
    const lg = el('linearGradient', { id: 'leaf', x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
    el('stop', { offset: '0%', 'stop-color': '#9ad3a5' }, lg);
    el('stop', { offset: '100%', 'stop-color': '#3b7d55' }, lg);
    const sp = el('linearGradient', { id: 'sunPetal', x1: 0, y1: 1, x2: 0, y2: 0 }, defs);
    el('stop', { offset: '0%', 'stop-color': '#f2a900' }, sp);
    el('stop', { offset: '100%', 'stop-color': '#ffe25c' }, sp);
    const sd = el('radialGradient', { id: 'sunDisc' }, defs);
    el('stop', { offset: '0%', 'stop-color': '#5a3510' }, sd);
    el('stop', { offset: '75%', 'stop-color': '#7a4a12' }, sd);
    el('stop', { offset: '100%', 'stop-color': '#3b2207' }, sd);
    ROSE_PALETTE.forEach((c, i) => {
      const rg = el('linearGradient', { id: 'rs' + i, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
      el('stop', { offset: '0%', 'stop-color': c[0] }, rg);
      el('stop', { offset: '55%', 'stop-color': c[1] }, rg);
      el('stop', { offset: '100%', 'stop-color': c[2] }, rg);
    });
    const rd = el('radialGradient', { id: 'roseDepth' }, defs);
    el('stop', { offset: '0%', 'stop-color': '#000', 'stop-opacity': .4 }, rd);
    el('stop', { offset: '45%', 'stop-color': '#000', 'stop-opacity': .12 }, rd);
    el('stop', { offset: '100%', 'stop-color': '#000', 'stop-opacity': 0 }, rd);
    const fm = el('radialGradient', { id: 'fmn' }, defs);
    el('stop', { offset: '0%', 'stop-color': '#d6eaff' }, fm);
    el('stop', { offset: '100%', 'stop-color': '#5b8def' }, fm);

    const k = Math.min(1.4, Math.max(.9, H / 700));
    const n = Math.max(7, Math.round(W / 50));
    const list = [];
    for (let i = 0; i < n; i++) {
      const s = rand(.75, 1.15);
      list.push({ s, x: (i + .5) * (W / n) + rand(-.35, .35) * (W / n), h: H * rand(.22, .46) * (.7 + .3 * s) });
    }
    list.sort((a, b) => a.s - b.s); // i più piccoli dietro

    // secondo piano: girasoli alti e rose, dietro i tulipani
    const far = el('g', { class: 'far-row' }, svg);
    const centerDelay = x => .6 + Math.abs(x - W / 2) / (W / 2) * 1.8 + rand(0, .5);
    const farList = [];
    for (let i = 0, m = Math.max(3, Math.round(n * .3)); i < m; i++)
      farList.push({ type: 'sun', x: (i + .5) * (W / m) + rand(-.3, .3) * (W / m) });
    for (let i = 0, m = Math.max(4, Math.round(n * .5)); i < m; i++)
      farList.push({ type: 'rose', x: (i + .5) * (W / m) + rand(-.4, .4) * (W / m) });
    farList.forEach(f => f.type === 'sun'
      ? sunflower(far, f.x, H * rand(.17, .28), rand(.8, 1) * k, centerDelay(f.x), H)
      : rose(far, f.x, H * rand(.14, .26), rand(.85, 1.1) * k, centerDelay(f.x), H));

    const back = el('g', { class: 'back-row' }, svg);
    const front = el('g', {}, svg);
    let maxD = 0;
    list.forEach(f => {
      // sbocciano dal centro verso i lati
      const d = .3 + Math.abs(f.x - W / 2) / (W / 2) * 1.8 + rand(0, .4);
      maxD = Math.max(maxD, d);
      tulip(f.s < .9 ? back : front, f.x, f.h, f.s * k, d, H);
    });

    grass(svg, W, H);
    const small = el('g', {}, svg);
    for (let i = 0, m = Math.round(n * 1.1); i < m; i++) {
      const args = [small, rand(10, W - 10), H - rand(8, H * .07), rand(.8, 1.3) * k, rand(1.2, maxD + 1.4), H];
      Math.random() < .5 ? forgetMeNot(...args) : daisy(...args);
    }

    return maxD;
  }

  /* ---------- Atmosfera: stelle e lucciole ---------- */
  function ambience() {
    for (let i = 0; i < 70; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.cssText = `left:${rand(0, 100)}vw;top:${rand(0, 60)}vh;--t:${rand(2, 5)}s;--dl:${rand(0, 4)}s`;
      document.body.appendChild(s);
    }
    for (let i = 0; i < 16; i++) {
      const f = document.createElement('div');
      f.className = 'ff';
      f.style.cssText = `left:${rand(5, 95)}vw;top:${rand(30, 92)}vh;--b:${rand(2.5, 5)}s;--bd:${rand(0, 4)}s;--t:${rand(6, 12)}s;--dx:${rand(-60, 60)}px;--dy:${rand(-50, 50)}px`;
      document.body.appendChild(f);
    }
  }

  function spawnPetal() {
    const p = document.createElement('div');
    p.className = 'petal';
    const c = PALETTE[pickColor()];
    p.style.cssText = `left:${rand(-5, 100)}vw;--s:${rand(9, 16)}px;--c:linear-gradient(135deg,${c[0]},${c[1]});--t:${rand(7, 12)}s;--dx:${rand(-120, 120)}px;--r:${rand(-540, 540)}deg`;
    p.addEventListener('animationend', () => p.remove());
    document.body.appendChild(p);
  }

  function hearts(x, y) {
    for (let i = 0; i < 8; i++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = '♥';
      const a = (i / 8) * Math.PI * 2 + rand(-.3, .3), dist = rand(40, 90);
      h.style.cssText = `left:${x}px;top:${y}px;--s:${rand(14, 24)}px;--c:${PALETTE[pickColor()][1]};--dx:${Math.cos(a) * dist}px;--dy:${Math.sin(a) * dist}px`;
      h.addEventListener('animationend', () => h.remove());
      document.body.appendChild(h);
    }
  }

  /* ---------- Avvio ---------- */
  ambience();
  let started = false, lastW = innerWidth, resizeTimer;

  document.getElementById('open').addEventListener('click', () => {
    document.getElementById('intro').classList.add('hide');
    started = true;
    startMusic();
    const maxD = build();
    document.getElementById('cat').classList.add('show');
    document.getElementById('donkey').classList.add('walk');
    setTimeout(() => {
      document.getElementById('message').classList.add('show');
      playLines();
    }, (maxD + 2.6) * 1000);
    setTimeout(() => setInterval(spawnPetal, 650), 4500);
  });

  document.addEventListener('pointerdown', e => { if (started) hearts(e.clientX, e.clientY); });

  addEventListener('resize', () => {
    if (!started || Math.abs(innerWidth - lastW) < 40) return; // ignora la barra di Safari
    lastW = innerWidth;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(build, 250);
  });
</script>
</body>
</html>
